name: Public tests

on:
  push:
  pull_request:
  workflow_dispatch:

# CI 只读取源码，不使用凭据或游戏资源，也不发布构建产物。
permissions:
  contents: read

jobs:
  portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Configure pure tests without game data
        run: cmake -S . -B build-tests -DSKY2_BUILD_MOD=OFF
      - name: Build
        run: cmake --build build-tests --config Release
      - name: C++ tests
        run: ctest --test-dir build-tests -C Release --output-on-failure
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_public_*.py" -v
